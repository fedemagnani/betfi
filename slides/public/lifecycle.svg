<rect x="706.8" y="157.6" width="134.0" height="16" rx="8" fill="#0a0b10" stroke="#f2a93b" stroke-opacity="0.55"/><text class="f" x="773.8" y="169.6" fill="#e6e8ee">live books · results</text>
<rect x="-497" y="-124" width="460" height="52" fill="#0a0b10"/>
<text class="h" x="-485" y="-102" fill="#e6e8ee">BetFi · bet lifecycle</text>
<text class="hs" x="-485" y="-84" fill="#8b93a5">which part sends what, from the quote to the payout</text>
<text class="lh" x="532" y="337" fill="#e6e8ee">Steps</text>
<text class="lb" x="532" y="357" fill="#e6e8ee">① Quote</text><text class="l" x="602" y="357" fill="#8b93a5">the quoter prices the slip on Pascal's books and signs it</text>
<text class="lb" x="532" y="374" fill="#e6e8ee">② Escrow</text><text class="l" x="602" y="374" fill="#8b93a5">the user signs open_pending; the relay co-signs and pays the fee</text>
<text class="lb" x="532" y="391" fill="#e6e8ee">③ Hedge</text><text class="l" x="602" y="391" fill="#8b93a5">the indexer sees the escrow; the hedge desk buys every leg</text>
<text class="lb" x="532" y="408" fill="#e6e8ee">④ Mint</text><text class="l" x="602" y="408" fill="#8b93a5">the crank sends finalize: ticket minted, payout locked in the vault</text>
<text class="lb" x="532" y="425" fill="#e6e8ee"></text><text class="l" x="602" y="425" fill="#8b93a5">nothing filled: refund_pending, 15 s after expiry</text>
<text class="lb" x="532" y="442" fill="#e6e8ee">⑤ Results</text><text class="l" x="602" y="442" fill="#8b93a5">the crank reads Pascal's results and sends resolve_leg</text>
<text class="lb" x="532" y="459" fill="#e6e8ee">⑥ Payout</text><text class="l" x="602" y="459" fill="#8b93a5">settle pays from the vault, or the user cashes out earlier</text>
<path class="flow" d="M532,486 h30" stroke="#e6e8ee"/><text class="l" x="572" y="490" fill="#8b93a5">HTTP · RPC · transaction</text>
<path class="bus" d="M532,503 h30" stroke="#c4d2ee"/><text class="l" x="572" y="507" fill="#8b93a5">in-process event bus</text>
</svg>
