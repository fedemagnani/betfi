<svg xmlns="http://www.w3.org/2000/svg" viewBox="-509 -136 1511 673" width="1511" height="673" role="img" aria-label="BetFi bet lifecycle: the quoter signs a quote, the user's open_pending goes through the relay into the schedina program's escrow, the indexer sees it, the hedge desk buys on Pascal through pascal-mock, the crank finalizes or refunds, then resolves and settles from Pascal's results">
