  .l { font-size: 11px; text-anchor: start; }
  .flow { fill: none; stroke-width: 1.6; stroke-dasharray: 5 7; opacity: 0.9; }
  .bus { fill: none; stroke-width: 1.4; stroke-dasharray: 1.5 4; stroke-linecap: round; }
  .flow, .bus { animation: dash 1.2s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -24; } }
  @media (prefers-reduced-motion: reduce) { .flow, .bus { animation: none; } circle { display: none; } }
</style>
