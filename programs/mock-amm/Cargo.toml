[package]
name = "mock-amm"
version = "0.1.0"
description = "Schedina mock AMM (devnet/localnet only): mock mints with a faucet and constant-product pools against mock USDC"
edition = "2021"
publish = false
# Same MSRV rule as the schedina crate: at or below the platform-tools rustc.
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_amm"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
# `anchor-spl/idl-build` needs its Token-2022 interface module; host-only, not in the .so.
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "anchor-spl/token_2022"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.2.2", features = ["init-if-needed"] }
# Classic SPL Token only.
anchor-spl = { version = "=1.2.2", default-features = false, features = ["token", "solana-v3"] }

[dev-dependencies]
litesvm = { version = "0.18.1", features = ["precompiles"] }
# The whole `[swap, Ed25519 verify, open_pending]` transaction runs against the real schedina .so;
# the crate gives its account and instruction types.
schedina = { path = "../schedina", features = ["no-entrypoint"] }
serde_json = "1"
solana-account = "4"
solana-ed25519-program = "3.0.0"
solana-instruction-error = "2"
solana-keypair = "3"
solana-message = "4"
solana-signer = "3"
solana-transaction = "4"
solana-transaction-error = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
