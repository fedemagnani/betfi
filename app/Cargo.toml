# Schedina mobile-first web app (Dioxus 0.7, wasm32). Standalone crate: the root
# workspace excludes `app`, and `dx` builds it from this directory (plan 0.B).
[package]
name = "schedina-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

# Own workspace root: cargo must not walk up to an enclosing workspace (the repo root excludes
# `app`, but a git worktree nested inside another checkout would otherwise find that one's root).
[workspace]

[dependencies]
dioxus = { version = "0.7", features = ["web", "router"] }
# Wallet (plan 1.F spike, D-1F-a): Wallet Standard wallets + devnet RPC. Requires dioxus ^0.7 and
# pins manganis =0.7.10 (android target), which in practice pins the dioxus 0.7.x line to 0.7.10.
dioxus-solana = "0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Desk HTTP (fetch) and the `/stream` WebSocket. 0.7 is already in the tree through dioxus-solana.
gloo-net = { version = "0.7", default-features = false, features = ["http", "json", "websocket"] }
gloo-timers = { version = "0.4", features = ["futures"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
futures-channel = "0.3"
js-sys = "0.3"
# Dev-only burner wallet (src/burner.rs, `/dev/wallet`): an in-page ed25519 key from
# `crypto.getRandomValues`. ed25519-dalek 3 sits beside the 2 that dioxus-solana pulls in.
ed25519-dalek = "3"
async-trait = "0.1"
web-sys = { version = "0.3", features = ["Window", "Crypto", "Document", "VisibilityState", "MediaQueryList", "Location", "Storage", "console"] }
# Instruction construction, host-tested (`cargo test -p schedina-tx`); no web dependencies.
schedina-tx = { path = "tx" }
# Unstyled, accessible behaviour (dialog, switch, toast, tabs, slider, select) under the kit's
# components (L9 design step 2); styled only by main.css. Pinned: the crate is pre-release.
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "9a758255ea26e2b20c8cecf4c1c946feb9e71da7", default-features = false, features = ["web"] }

[lints.rust]
unsafe_code = "forbid"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
