[package]
name = "pascal-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Typed client for Pascal's REST, market-data WebSocket and signed trade API"

[[bin]]
name = "pascal-cli"
path = "src/bin/pascal-cli.rs"

[dependencies]
async-trait = "0.1"
bs58 = "0.5"
clap = { version = "4.6", features = ["derive"] }
ed25519-dalek = "3"
fastrand = "2.5"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "rustls"] }
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { workspace = true, features = ["sync", "time", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
url = "2.5"

[dev-dependencies]
proptest = "1.12"
sha2 = "0.11"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
